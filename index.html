<style>
  :root {
    --bg: #0f1117;
    --bg2: #1a1d27;
    --bg3: #22263a;
    --border: #2e3250;
    --text: #e8eaf6;
    --text2: #9ca3c0;
    --accent-ai: #6c63ff;
    --accent-market: #00c9a7;
    --accent-crypto: #f7931a;
    --tag-bg: rgba(108,99,255,0.15);

  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', sans-serif;
    line-height: 1.6;
    min-height: 100vh;
  }
  header {
    background: linear-gradient(135deg, #1a1d27 0%, #0f1117 100%);
    border-bottom: 1px solid var(--border);
    padding: 20px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(12px);
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .logo-icon {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--accent-ai), var(--accent-crypto));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  .logo-text { font-size: 20px; font-weight: 700; letter-spacing: 0.5px; }
  .logo-text span { color: var(--accent-ai); }
  .header-meta { text-align: right; }
  .header-date { font-size: 15px; font-weight: 600; color: var(--text); }
  .header-time { font-size: 13px; color: var(--text2); margin-top: 2px; }
  .tabs {
    display: flex;
    gap: 0;
    border-bottom: 1px solid var(--border);
    padding: 0 32px;
    background: var(--bg2);
    overflow-x: auto;
  }
  .tab {
    padding: 14px 24px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    color: var(--text2);
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
    white-space: nowrap;
    user-select: none;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--text); }
  .tab[data-tab="ai"].active { border-color: var(--accent-ai); color: var(--accent-ai); }
  .tab[data-tab="markets"].active { border-color: var(--accent-market); color: var(--accent-market); }
  .tab[data-tab="crypto"].active { border-color: var(--accent-crypto); color: var(--accent-crypto); }
  .main { max-width: 1200px; margin: 0 auto; padding: 32px 32px; }
  .panel { display: none; }
  .panel.active { display: block; }
  .section-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
    margin-top: 32px;
  }
  .section-header:first-of-type { margin-top: 0; }
  .section-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .section-title {
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text2);
  }
  .section-line { flex: 1; height: 1px; background: var(--border); }
  .news-grid { display: grid; gap: 12px; }
  .news-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 20px;
    transition: background 0.15s, border-color 0.15s;
    cursor: default;
  }
  .news-card:hover {
    background: var(--bg3);
    border-color: rgba(255,255,255,0.1);
  }
  .news-source {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 6px;
    opacity: 0.7;
  }
  .news-text {
    font-size: 14px;
    color: var(--text);
    line-height: 1.65;
  }
  .ai-dot { background: var(--accent-ai); }
  .market-dot { background: var(--accent-market); }
  .crypto-dot { background: var(--accent-crypto); }
  .ai-source { color: var(--accent-ai); }
  .market-source { color: var(--accent-market); }
  .crypto-source { color: var(--accent-crypto); }
  .summary-bar {
    background: linear-gradient(135deg, var(--bg2), var(--bg3));
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px 28px;
    margin-bottom: 32px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
  }
  .summary-item { }
  .summary-label { font-size: 11px; color: var(--text2); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 6px; }
  .summary-val { font-size: 14px; font-weight: 600; line-height: 1.4; }
  .ai-val { color: var(--accent-ai); }
  .market-val { color: var(--accent-market); }
  .crypto-val { color: var(--accent-crypto); }
  footer {
    text-align: center;
    padding: 24px;
    color: var(--text2);
    font-size: 12px;
    border-top: 1px solid var(--border);
    margin-top: 48px;
  }
  @media (max-width: 700px) {
    header { padding: 14px 16px; }
    .main { padding: 16px; }
    .tabs { padding: 0 16px; }
    .summary-bar { grid-template-columns: 1fr; gap: 12px; }
  }
</style>
</head>

<footer>
  ZP News Station · 由 Claude AI 自动生成 · 数据来源：TechCrunch、Bloomberg、Yahoo Finance、CoinDesk、The Block 等
</footer>

<script>
(function() {
  const d = REPORT_DATA;

  // Header
  document.getElementById('hdr-date').textContent = d.date;
  document.getElementById('hdr-time').textContent = '更新于 ' + d.updatedAt;

  // Summary bar
  const sb = document.getElementById('summary-bar');
  const topAI = d.ai.bigtech[0]?.text.slice(0,60) + '…';
  const topMkt = d.markets.overview[0]?.text.slice(0,60) + '…';
  const topCrypto = d.crypto.market[0]?.text.slice(0,60) + '…';
  sb.innerHTML = `
    <div class="summary-item"><div class="summary-label">🤖 AI 要闻</div><div class="summary-val ai-val">${topAI}</div></div>
    <div class="summary-item"><div class="summary-label">📈 市场要闻</div><div class="summary-val market-val">${topMkt}</div></div>
    <div class="summary-item"><div class="summary-label">🪙 Crypto 要闻</div><div class="summary-val crypto-val">${topCrypto}</div></div>
  `;

  // Render helpers
  function renderCards(containerId, items, colorClass) {
    const el = document.getElementById(containerId);
    if (!el || !items || !items.length) { if(el) el.innerHTML = '<div class="news-card"><div class="news-text" style="color:var(--text2)">暂无数据</div></div>'; return; }
    el.innerHTML = items.map(item => `
      <div class="news-card">
        <div class="news-source ${colorClass}">${item.source}</div>
        <div class="news-text">${item.text}</div>
      </div>
    `).join('');
  }

  // AI
  renderCards('ai-bigtech', d.ai.bigtech, 'ai-source');
  renderCards('ai-trends', d.ai.trends, 'ai-source');
  renderCards('ai-tech', d.ai.tech, 'ai-source');
  renderCards('ai-startup', d.ai.startup, 'ai-source');

  // Markets
  renderCards('mkt-overview', d.markets.overview, 'market-source');
  renderCards('mkt-macro', d.markets.macro, 'market-source');
  renderCards('mkt-policy', d.markets.policy, 'market-source');
  renderCards('mkt-institution', d.markets.institution, 'market-source');
  renderCards('mkt-stocks', d.markets.stocks, 'market-source');
  renderCards('mkt-commodity', d.markets.commodity, 'market-source');
  renderCards('mkt-other', d.markets.other, 'market-source');

  // Crypto
  renderCards('crypto-market', d.crypto.market, 'crypto-source');
  renderCards('crypto-news', d.crypto.news, 'crypto-source');
  renderCards('crypto-onchain', d.crypto.onchain, 'crypto-source');
  renderCards('crypto-funding', d.crypto.funding, 'crypto-source');

  // Tabs
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      const t = tab.dataset.tab;
      document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(x => x.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('panel-' + t).classList.add('active');
      localStorage.setItem('zp-active-tab', t);
    });
  });

  // Restore tab
  try {
    const saved = localStorage.getItem('zp-active-tab');
    if (saved) {
      const t = document.querySelector(`.tab[data-tab="${saved}"]`);
      if (t) t.click();
    }
  } catch(e) {}
})();
</script>
</body>
</html>
