<script>
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('sec-' + tab).classList.add('active');
}

const AI_SECTIONS = [
  {key: 'bigtech', icon: '🏢', label: '大厂动态'},
  {key: 'trends', icon: '📊', label: '行业趋势'},
  {key: 'tech', icon: '🔬', label: '前沿技术'},
  {key: 'startup', icon: '🚀', label: '初创公司'},
];
const MARKET_SECTIONS = [
  {key: 'overview', icon: '🌐', label: '全球概览'},
  {key: 'macro', icon: '📉', label: '宏观经济'},
  {key: 'policy', icon: '🏛️', label: '政策·地缘'},
  {key: 'institution', icon: '🏦', label: '机构动态'},
  {key: 'stocks', icon: '📈', label: '个股异动'},
  {key: 'commodity', icon: '⛽', label: '大宗商品'},
  {key: 'other', icon: '📌', label: '其他财经'},
];
const CRYPTO_SECTIONS = [
  {key: 'market', icon: '💹', label: '市场行情'},
  {key: 'news', icon: '📰', label: '重大新闻'},
  {key: 'onchain', icon: '⛓️', label: '链上·技术'},
  {key: 'funding', icon: '💰', label: '融资动态'},
];

function buildCategory(items, icon, label) {
  if (!items || items.length === 0) return '';
  const rows = items.map(item => `
    <div class="news-item">
      <div class="news-source">${item.source}</div>
      <div class="news-text">${item.text}</div>
    </div>`).join('');
  return `<div class="category">
    <div class="category-header">
      <span class="icon">${icon}</span>
      <h3>${label}</h3>
      <span class="count">${items.length}条</span>
    </div>
    <div class="news-list">${rows}</div>
  </div>`;
}

function render() {
  const d = REPORT_DATA;
  document.getElementById('report-meta').textContent = `📅 ${d.date}  ⏱ 更新于 ${d.updatedAt}`;

  // Hero highlights
  const first = (arr) => arr && arr.length > 0 ? arr[0].text : '暂无数据';
  document.getElementById('hero-highlights').innerHTML = `
    <div class="highlight-card">
      <div class="label">🤖 AI科技头条</div>
      <div class="value">${first(d.ai.bigtech)}</div>
    </div>
    <div class="highlight-card">
      <div class="label">📈 资本市场头条</div>
      <div class="value">${first(d.markets.policy)}</div>
    </div>
    <div class="highlight-card">
      <div class="label">🪙 Crypto头条</div>
      <div class="value">${first(d.crypto.news)}</div>
    </div>`;

  // Overview lists — show first item of each major category
  let overviewHTML = '';
  const overviewItems = [
    {label:'🤖 AI — 大厂', item: d.ai.bigtech[0]},
    {label:'🤖 AI — 初创', item: d.ai.startup[0]},
    {label:'📈 市场概览', item: d.markets.overview[0]},
    {label:'📈 宏观', item: d.markets.macro[0]},
    {label:'📈 政策', item: d.markets.policy[0]},
    {label:'📈 个股', item: d.markets.stocks[0]},
    {label:'🪙 Crypto行情', item: d.crypto.market[0]},
    {label:'🪙 Crypto新闻', item: d.crypto.news[0]},
  ];
  overviewHTML = `<div class="category"><div class="category-header"><span class="icon">📋</span><h3>全文速览（每类首条）</h3></div><div class="news-list">` +
    overviewItems.filter(o=>o.item).map(o=>`
      <div class="news-item">
        <div class="news-source">${o.label} · ${o.item.source}</div>
        <div class="news-text">${o.item.text}</div>
      </div>`).join('') +
    `</div></div>`;
  document.getElementById('overview-lists').innerHTML = overviewHTML;

  // AI section
  document.getElementById('sec-ai').innerHTML = AI_SECTIONS.map(s => buildCategory(d.ai[s.key], s.icon, s.label)).join('');

  // Markets section
  document.getElementById('sec-markets').innerHTML = MARKET_SECTIONS.map(s => buildCategory(d.markets[s.key], s.icon, s.label)).join('');

  // Crypto section
  document.getElementById('sec-crypto').innerHTML = CRYPTO_SECTIONS.map(s => buildCategory(d.crypto[s.key], s.icon, s.label)).join('');
}

render();
</script>
</body>
</html>
