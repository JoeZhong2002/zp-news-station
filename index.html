<html lang="zh">
<head>
  <meta charset="UTF-8">

  <style>
    :root {
      --bg: #0f1117;
      --bg2: #161b27;
      --bg3: #1e2435;
      --border: #2a3148;
      --text: #e2e8f0;
      --text-muted: #8892a4;
      --accent-ai: #6366f1;
      --accent-market: #10b981;
      --accent-crypto: #f59e0b;
      --tag-bg: #1e2435;
      --shadow: 0 4px 24px rgba(0,0,0,0.4);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }

    /* Header */
    .header { background: linear-gradient(135deg, #1a1f35 0%, #0f1117 100%); border-bottom: 1px solid var(--border); padding: 20px 24px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
    .header-left { display: flex; align-items: center; gap: 16px; }
    .logo { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; background: linear-gradient(135deg, #6366f1, #10b981, #f59e0b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .header-meta { font-size: 13px; color: var(--text-muted); }
    .header-meta .date { font-size: 15px; font-weight: 600; color: var(--text); }
    .update-badge { background: #10b981; color: #fff; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; letter-spacing: 0.5px; }

    /* Tab Nav */
    .tab-nav { display: flex; gap: 4px; padding: 16px 24px 0; border-bottom: 1px solid var(--border); overflow-x: auto; }
    .tab-btn { padding: 10px 20px; border: none; background: transparent; color: var(--text-muted); font-size: 14px; font-weight: 600; cursor: pointer; border-radius: 8px 8px 0 0; border-bottom: 3px solid transparent; white-space: nowrap; transition: all 0.2s; }
    .tab-btn:hover { color: var(--text); background: var(--bg3); }
    .tab-btn.active { color: var(--text); border-bottom-color: var(--accent); }
    .tab-btn.tab-ai.active { --accent: #6366f1; color: #818cf8; border-bottom-color: #6366f1; }
    .tab-btn.tab-market.active { --accent: #10b981; color: #34d399; border-bottom-color: #10b981; }
    .tab-btn.tab-crypto.active { --accent: #f59e0b; color: #fbbf24; border-bottom-color: #f59e0b; }

    /* Main Content */
    .main { padding: 24px; max-width: 1400px; margin: 0 auto; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Section headers */
    .section-label { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 12px; padding: 6px 12px; border-radius: 6px; display: inline-block; }
    .section-label.ai { background: rgba(99,102,241,0.15); color: #818cf8; }
    .section-label.market { background: rgba(16,185,129,0.15); color: #34d399; }
    .section-label.crypto { background: rgba(245,158,11,0.15); color: #fbbf24; }

    /* Grid */
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-bottom: 24px; }

    /* Cards */
    .card { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 20px; box-shadow: var(--shadow); }
    .card-title { font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 14px; color: var(--text-muted); }
    .news-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
    .news-item:last-child { border-bottom: none; padding-bottom: 0; }
    .news-source { font-size: 11px; font-weight: 600; color: var(--text-muted); margin-bottom: 5px; display: flex; align-items: center; gap: 6px; }
    .news-source::before { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .news-text { font-size: 13.5px; line-height: 1.65; color: var(--text); }
    .news-text strong { color: #fff; }

    /* Market data table */
    .market-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .market-table th { text-align: left; padding: 8px 10px; color: var(--text-muted); font-size: 11px; font-weight: 600; letter-spacing: 0.5px; border-bottom: 1px solid var(--border); }
    .market-table td { padding: 10px; border-bottom: 1px solid rgba(42,49,72,0.5); }
    .market-table tr:last-child td { border-bottom: none; }
    .up { color: #10b981; font-weight: 700; }
    .down { color: #f43f5e; font-weight: 700; }
    .neutral { color: var(--text-muted); }
    .asset-name { font-weight: 600; color: var(--text); }
    .asset-price { font-weight: 700; font-size: 14px; }

    /* Crypto price cards */
    .price-card { background: var(--bg3); border: 1px solid var(--border); border-radius: 10px; padding: 16px; display: flex; justify-content: space-between; align-items: center; }
    .price-card .symbol { font-size: 13px; font-weight: 700; color: var(--text-muted); }
    .price-card .name { font-size: 11px; color: var(--text-muted); }
    .price-card .price { font-size: 18px; font-weight: 800; color: var(--text); }
    .price-card .change { font-size: 13px; font-weight: 700; padding: 3px 8px; border-radius: 6px; }
    .change.up { background: rgba(16,185,129,0.15); }
    .change.down { background: rgba(244,63,94,0.15); }

    /* Fear greed meter */
    .fg-meter { display: flex; align-items: center; gap: 20px; padding: 16px; background: var(--bg3); border-radius: 10px; border: 1px solid var(--border); }
    .fg-circle { width: 72px; height: 72px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: conic-gradient(#f43f5e 0deg, #f43f5e calc(var(--pct)*3.6deg), var(--border) calc(var(--pct)*3.6deg)); }
    .fg-inner { width: 56px; height: 56px; border-radius: 50%; background: var(--bg3); display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .fg-score { font-size: 20px; font-weight: 900; color: #f43f5e; }
    .fg-label { font-size: 9px; color: var(--text-muted); font-weight: 600; }
    .fg-info .title { font-size: 15px; font-weight: 700; color: #f43f5e; }
    .fg-info .sub { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

    /* Summary banner */
    .summary-banner { background: linear-gradient(135deg, var(--bg2), var(--bg3)); border: 1px solid var(--border); border-radius: 12px; padding: 20px 24px; margin-bottom: 24px; display: flex; gap: 24px; flex-wrap: wrap; }
    .summary-item { flex: 1; min-width: 200px; }
    .summary-item .s-label { font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; }
    .summary-item .s-value { font-size: 14px; line-height: 1.5; color: var(--text); }

    /* Section divider */
    .section-gap { margin-bottom: 28px; }
    h3.subsection { font-size: 13px; font-weight: 700; color: var(--text-muted); margin: 0 0 12px; text-transform: uppercase; letter-spacing: 1px; }

    /* Responsive */
    @media (max-width: 600px) {
      .header { padding: 16px; }
      .main { padding: 16px; }
      .grid-2, .grid-3 { grid-template-columns: 1fr; }
    }
  </style>
</head>

<script>
// Tab switching
function switchTab(tab) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  document.querySelector('.tab-btn.tab-' + tab).classList.add('active');
}

// Render news list
function renderList(containerId, items) {
  const el = document.getElementById(containerId);
  if (!el || !items || !items.length) { if (el) el.innerHTML = '<div style="color:#8892a4;font-size:13px;padding:8px 0">暂无数据</div>'; return; }
  el.innerHTML = items.map(item => `
    <div class="news-item">
      <div class="news-source">${item.source}</div>
      <div class="news-text">${item.text}</div>
    </div>
  `).join('');
}

// Render market price table
function renderPriceTable() {
  const rows = [
    { name: 'S&P 500', price: '7,416.59', change: '-1.92%', dir: 'down' },
    { name: '纳斯达克', price: '24,509.76', change: '-2.49%', dir: 'down' },
    { name: '道琼斯', price: '51,608.17', change: '-1.41%', dir: 'down' },
    { name: '10年期美债', price: '5.10%', change: '—', dir: 'neutral' },
    { name: '美元指数', price: '103.61', change: '—', dir: 'neutral' },
    { name: '黄金', price: '$3,880', change: '+0.62%', dir: 'up' },
    { name: '白银', price: '$47.72', change: '+1.55%', dir: 'up' },
    { name: '布伦特原油', price: '$91.73', change: '-0.77%', dir: 'down' },
    { name: 'WTI 原油', price: '$86.28', change: '—', dir: 'neutral' },
  ];
  const tbody = document.getElementById('market-price-body');
  tbody.innerHTML = rows.map(r => `
    <tr>
      <td class="asset-name">${r.name}</td>
      <td class="asset-price">${r.price}</td>
      <td class="${r.dir}">${r.change}</td>
    </tr>
  `).join('');
}

// Render crypto price cards
function renderCryptoPrices() {
  const coins = [
    { symbol: 'BTC', name: 'Bitcoin', price: '$64,849', change: '+0.27%', dir: 'up' },
    { symbol: 'ETH', name: 'Ethereum', price: '$1,830.93', change: '+0.96%', dir: 'up' },
    { symbol: 'SOL', name: 'Solana', price: '$72.80', change: '+1.94%', dir: 'up' },
    { symbol: 'BNB', name: 'BNB', price: '$593.71', change: '+0.75%', dir: 'up' },
    { symbol: 'XRP', name: 'XRP', price: '$0.9635', change: '+0.67%', dir: 'up' },
  ];
  const container = document.getElementById('crypto-price-cards');
  container.innerHTML = coins.map(c => `
    <div class="price-card">
      <div>
        <div class="symbol">${c.symbol}</div>
        <div class="name">${c.name}</div>
        <div class="price">${c.price}</div>
      </div>
      <span class="change ${c.dir}">${c.change}</span>
    </div>
  `).join('');
}

// Render Fear & Greed
function renderFG() {
  const score = 12;
  const container = document.getElementById('fg-container');
  container.innerHTML = `
    <div class="fg-meter">
      <div class="fg-circle" style="--pct:${score}">
        <div class="fg-inner">
          <div class="fg-score">${score}</div>
          <div class="fg-label">/ 100</div>
        </div>
      </div>
      <div class="fg-info">
        <div class="title">极度恐惧</div>
        <div class="sub">恐贪指数 12（前日 10）</div>
        <div class="sub" style="margin-top:8px;font-size:11px;color:#8892a4">总市值 $2.29万亿 (+1.2%) · 稳定币 $2835亿 (-0.2%)</div>
      </div>
    </div>
  `;
}

// Market overview banner
function renderMarketBanner() {
  const banner = document.getElementById('market-overview-banner');
  banner.innerHTML = `
    <div class="summary-item">
      <div class="s-label" style="color:#818cf8">美股</div>
      <div class="s-value" style="color:#f43f5e">S&P 500 −1.92% · 纳指 −2.49%<br>道琼斯 −1.41% · VIX 22.91↑</div>
    </div>
    <div class="summary-item">
      <div class="s-label" style="color:#34d399">亚太</div>
      <div class="s-value" style="color:#f43f5e">MSCI亚太 −1.5%<br>台湾 −2.5% · 韩国 −2.6%</div>
    </div>
    <div class="summary-item">
      <div class="s-label" style="color:#fbbf24">利率/汇率</div>
      <div class="s-value">美债10Y 5.10%<br>美元指数 103.61</div>
    </div>
    <div class="summary-item">
      <div class="s-label" style="color:#818cf8">本周焦点</div>
      <div class="s-value">英伟达财报 · Anthropic IPO (11/19)<br>FOMC纪要 (11/18)</div>
    </div>
  `;
}

// Initialize
function init() {
  const D = REPORT_DATA;
  document.getElementById('report-date').textContent = D.date;
  document.getElementById('report-time').textContent = D.updatedAt + ' ET';

  // AI
  renderList('ai-bigtech-list', D.ai.bigtech);
  renderList('ai-trends-list', D.ai.trends);
  renderList('ai-tech-list', D.ai.tech);
  renderList('ai-startup-list', D.ai.startup);

  // Market
  renderMarketBanner();
  renderPriceTable();
  renderList('market-macro-list', D.markets.macro);
  renderList('market-policy-list', D.markets.policy);
  renderList('market-institution-list', D.markets.institution);
  renderList('market-stocks-list', D.markets.stocks);
  renderList('market-other-list', D.markets.other);

  // Crypto
  renderCryptoPrices();
  renderFG();
  renderList('crypto-news-list', D.crypto.news);
  renderList('crypto-onchain-list', D.crypto.onchain);
  renderList('crypto-funding-list', D.crypto.funding);
}

document.addEventListener('DOMContentLoaded', init);
</script>
