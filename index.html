<title>ZP News Station — 每日三合一日报</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d27;
    --border: #2a2d3a;
    --text: #e2e8f0;
    --muted: #8892a4;
    --ai: #6366f1;
    --markets: #10b981;
    --crypto: #f59e0b;
    --accent: #3b82f6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; }
  header { background: linear-gradient(135deg, #1a1d27 0%, #0f1117 100%); border-bottom: 1px solid var(--border); padding: 20px 32px; display: flex; align-items: center; justify-content: space-between; }
  header h1 { font-size: 22px; font-weight: 700; background: linear-gradient(90deg, #6366f1, #10b981, #f59e0b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .meta { font-size: 13px; color: var(--muted); }
  .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); padding: 0 32px; background: var(--card); }
  .tab { padding: 14px 24px; font-size: 14px; font-weight: 600; cursor: pointer; border-bottom: 3px solid transparent; color: var(--muted); transition: all 0.2s; }
  .tab.active { color: var(--text); }
  .tab[data-tab="ai"].active { border-color: var(--ai); color: var(--ai); }
  .tab[data-tab="markets"].active { border-color: var(--markets); color: var(--markets); }
  .tab[data-tab="crypto"].active { border-color: var(--crypto); color: var(--crypto); }
  .tab:hover { color: var(--text); }
  .content { padding: 24px 32px; max-width: 1200px; margin: 0 auto; }
  .panel { display: none; }
  .panel.active { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 16px; }
  .section-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
  .section-title { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
  .section-title.ai { color: var(--ai); }
  .section-title.markets { color: var(--markets); }
  .section-title.crypto { color: var(--crypto); }
  .news-item { padding: 10px 0; border-bottom: 1px solid var(--border); }
  .news-item:last-child { border-bottom: none; padding-bottom: 0; }
  .news-source { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
  .news-text { font-size: 14px; line-height: 1.6; color: var(--text); }
  .empty { color: var(--muted); font-size: 13px; font-style: italic; }
  .stats-bar { display: flex; gap: 16px; padding: 16px 32px; background: var(--card); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .stat { font-size: 13px; }
  .stat-label { color: var(--muted); }
  .stat-value { font-weight: 700; margin-left: 6px; }
  .stat-value.up { color: #10b981; }
  .stat-value.down { color: #ef4444; }
  .stat-value.neutral { color: var(--accent); }
</style>
</head>

<script>
const SECTION_META = {
  ai: {
    bigtech:  { label: "大厂动态", icon: "🏢" },
    trends:   { label: "行业趋势", icon: "📊" },
    tech:     { label: "前沿技术", icon: "🔬" },
    startup:  { label: "初创动态", icon: "🚀" },
  },
  markets: {
    overview:    { label: "全球概览", icon: "🌐" },
    macro:       { label: "宏观经济", icon: "🏦" },
    policy:      { label: "政策动态", icon: "📜" },
    institution: { label: "投资机构", icon: "🏛" },
    stocks:      { label: "个股异动", icon: "📉" },
    commodity:   { label: "大宗商品", icon: "🛢" },
    other:       { label: "其他财经", icon: "📋" },
  },
  crypto: {
    market:  { label: "市场行情", icon: "💹" },
    news:    { label: "重大新闻", icon: "📰" },
    onchain: { label: "链上动态", icon: "⛓" },
    funding: { label: "融资动态", icon: "💰" },
  }
};

function renderPanel(panelId, data, module, colorClass) {
  const panel = document.getElementById(panelId);
  const sectionKeys = Object.keys(SECTION_META[module]);
  panel.innerHTML = sectionKeys.map(key => {
    const meta = SECTION_META[module][key];
    const items = (data && data[key]) || [];
    return `<div class="section-card">
      <div class="section-title ${colorClass}">${meta.icon} ${meta.label}</div>
      ${items.length === 0
        ? '<p class="empty">暂无数据</p>'
        : items.map(item => `
          <div class="news-item">
            <div class="news-source">${item.source || ''}</div>
            <div class="news-text">${item.text || ''}</div>
          </div>`).join('')
      }
    </div>`;
  }).join('');
}

function renderStats(data) {
  const bar = document.getElementById('stats-bar');
  const stats = [
    { label: 'BTC', value: data._btc || '--', cls: 'neutral' },
    { label: 'ETH', value: data._eth || '--', cls: 'neutral' },
    { label: '布伦特原油', value: data._oil || '--', cls: 'up' },
    { label: '黄金', value: data._gold || '--', cls: 'neutral' },
    { label: '道指', value: data._dow || '--', cls: 'down' },
    { label: '纳指', value: data._nasdaq || '--', cls: 'down' },
    { label: '标普500', value: data._sp500 || '--', cls: 'down' },
  ];
  bar.innerHTML = stats.map(s =>
    `<div class="stat"><span class="stat-label">${s.label}</span><span class="stat-value ${s.cls}">${s.value}</span></div>`
  ).join('');
}

function init() {
  if (!REPORT_DATA || !REPORT_DATA.date) {
    document.getElementById('header-meta').textContent = '数据未加载';
    return;
  }
  document.getElementById('header-meta').textContent = `📅 ${REPORT_DATA.date} · 更新于 ${REPORT_DATA.updatedAt || '--:--'}`;
  renderStats(REPORT_DATA);
  renderPanel('panel-ai', REPORT_DATA.ai, 'ai', 'ai');
  renderPanel('panel-markets', REPORT_DATA.markets, 'markets', 'markets');
  renderPanel('panel-crypto', REPORT_DATA.crypto, 'crypto', 'crypto');
}

// Tab switching
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
  });
});

init();
</script>
</body>
