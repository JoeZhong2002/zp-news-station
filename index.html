<style>
  :root {

  * { box-sizing: border-box; margin: 0; padding: 0; }

  header { background: linear-gradient(135deg, #1a1d27 0%, #0f1117 100%); border-bottom: 1px solid var(--border); padding: 20px 32px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px); }
  .logo { font-size: 22px; font-weight: 800; background: linear-gradient(90deg, #6c63ff, #00c896, #f7931a); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .meta { font-size: 13px; color: var(--text-muted); }
  .meta span { color: var(--text); font-weight: 600; }
  nav { display: flex; gap: 6px; padding: 16px 32px; background: var(--card); border-bottom: 1px solid var(--border); overflow-x: auto; }
  nav button { background: var(--tag-bg); color: var(--text-muted); border: 1px solid var(--border); padding: 7px 18px; border-radius: 20px; cursor: pointer; font-size: 13px; white-space: nowrap; transition: all 0.2s; }
  nav button:hover, nav button.active { background: var(--accent-ai); color: #fff; border-color: var(--accent-ai); }
  nav button[data-tab="markets"].active { background: var(--accent-market); border-color: var(--accent-market); }
  nav button[data-tab="crypto"].active { background: var(--accent-crypto); border-color: var(--accent-crypto); }
  main { max-width: 1200px; margin: 0 auto; padding: 24px 24px 60px; }
  .section { display: none; }
  .section.active { display: block; }
  .section-header { margin-bottom: 20px; }
  .section-title { font-size: 24px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
  .section-title .icon { font-size: 28px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; transition: border-color 0.2s, transform 0.15s; }
  .card:hover { border-color: var(--accent-ai); transform: translateY(-2px); }
  .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .cat-tag { font-size: 11px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; padding: 3px 10px; border-radius: 20px; background: var(--tag-bg); color: var(--accent-ai); }
  .markets .cat-tag { color: var(--accent-market); }
  .crypto-section .cat-tag { color: var(--accent-crypto); }
  .news-list { list-style: none; }
  .news-item { padding: 11px 0; border-bottom: 1px solid var(--border); }
  .news-item:last-child { border-bottom: none; }
  .news-source { font-size: 11px; color: var(--accent-ai); font-weight: 600; margin-bottom: 4px; }
  .markets .news-source { color: var(--accent-market); }
  .crypto-section .news-source { color: var(--accent-crypto); }
  .news-text { font-size: 14px; line-height: 1.6; color: var(--text); }
  .ticker-bar { background: var(--card2); border: 1px solid var(--border); border-radius: 10px; padding: 14px 18px; margin-bottom: 20px; overflow: hidden; }
  .ticker-content { display: flex; gap: 28px; flex-wrap: wrap; }
  .ticker-item { font-size: 13px; display: flex; gap: 8px; align-items: center; }
  .ticker-label { color: var(--text-muted); }
  .ticker-val { font-weight: 700; }
  .up { color: #00c896; }
  .down { color: #ff5555; }
  .neutral { color: #f7931a; }
  footer { text-align: center; padding: 20px; font-size: 12px; color: var(--text-muted); border-top: 1px solid var(--border); margin-top: 40px; }
  @media (max-width: 600px) { header { padding: 14px 16px; } main { padding: 16px; } .grid { grid-template-columns: 1fr; } }
</style>
</head>

function switchTab(tab) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
}

function buildCards(data, cats, gridId) {
  const grid = document.getElementById(gridId);
  grid.innerHTML = '';
  for (const [key, meta] of Object.entries(cats)) {
    const items = data[key] || [];
    if (!items.length) continue;
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-header">
        <span style="font-size:20px">${meta.icon}</span>
        <span class="cat-tag">${meta.label}</span>
      </div>
      <ul class="news-list">
        ${items.map(i => `<li class="news-item"><div class="news-source">${i.source}</div><div class="news-text">${i.text}</div></li>`).join('')}
      </ul>
    `;
    grid.appendChild(card);
  }
}

function buildTicker() {
  const tickers = [
    { label: 'S&P 500', val: '7,230.12', cls: 'up', ch: '+0.29%' },
    { label: 'NASDAQ', val: '25,114.44', cls: 'up', ch: '+0.89%' },
    { label: 'DOW', val: '49,499.27', cls: 'down', ch: '-0.31%' },
    { label: '日经225', val: '59,513.12', cls: 'up', ch: '+0.38%' },
    { label: '恒生指数', val: '25,777', cls: 'down', ch: '-1.30%' },
    { label: '黄金', val: '$4,600+', cls: 'up', ch: '↑' },
    { label: 'WTI原油', val: '$101.05', cls: 'down', ch: '-3.82%' }

  document.getElementById('ticker').innerHTML = tickers.map(t =>

}

    { label: 'ETH', val: '$2,300', cls: 'neutral', ch: '→震荡' },
    { label: '总市值', val: '↑回升', cls: 'up', ch: '' },
    { label: '恐贪指数', val: '中性偏贪婪', cls: 'neutral', ch: '' }
  ];
  document.getElementById('crypto-ticker').innerHTML = tickers.map(t =>
    `<div class="ticker-item"><span class="ticker-label">${t.label}</span><span class="ticker-val ${t.cls}">${t.val} <span style="font-size:11px">${t.ch}</span></span></div>`
  ).join('');
}

function init() {
  document.getElementById('report-date').textContent = REPORT_DATA.date;
  document.getElementById('updated-at').textContent = REPORT_DATA.updatedAt;
  buildCards(REPORT_DATA.ai, AI_CATS, 'ai-grid');
  buildCards(REPORT_DATA.markets, MKT_CATS, 'markets-grid');
  buildCards(REPORT_DATA.crypto, CRP_CATS, 'crypto-grid');
  buildTicker();
  buildCryptoTicker();
}

init();
</script>
