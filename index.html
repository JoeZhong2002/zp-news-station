<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZP News Station — 每日三合一日报</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3350;
    --text: #e8eaf0;
    --text-sub: #8b90a8;
    --ai: #7c6aff;
    --ai-bg: #1e1a3a;
    --markets: #22c55e;
    --markets-bg: #0f2318;
    --crypto: #f59e0b;
    --crypto-bg: #211a08;
    --accent: #3b82f6;
    --tag-bg: #2e3350;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }
  
  header {
    background: linear-gradient(135deg, #0f1117 0%, #1a1230 50%, #0f1117 100%);
    border-bottom: 1px solid var(--border);
    padding: 24px 32px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .logo { display: flex; align-items: center; gap: 12px; }
  .logo-icon { font-size: 32px; }
  .logo-text h1 { font-size: 22px; font-weight: 700; background: linear-gradient(90deg, #7c6aff, #3b82f6, #22c55e); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .logo-text p { font-size: 12px; color: var(--text-sub); margin-top: 2px; }
  .header-meta { text-align: right; }
  .update-badge { display: inline-flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 6px 14px; font-size: 13px; color: var(--text-sub); }
  .update-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--markets); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  nav {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 32px;
    display: flex; gap: 0;
    overflow-x: auto;
  }
  .tab {
    padding: 14px 20px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    color: var(--text-sub);
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
    white-space: nowrap;
    display: flex; align-items: center; gap: 8px;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); }
  .tab.ai.active { border-bottom-color: var(--ai); color: var(--ai); }
  .tab.markets.active { border-bottom-color: var(--markets); color: var(--markets); }
  .tab.crypto.active { border-bottom-color: var(--crypto); color: var(--crypto); }

  main { max-width: 1200px; margin: 0 auto; padding: 28px 24px; }

  .section { display: none; }
  .section.active { display: block; }

  .section-header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
  .section-icon { font-size: 28px; }
  .section-title { font-size: 20px; font-weight: 700; }
  .section-count { background: var(--tag-bg); color: var(--text-sub); font-size: 11px; padding: 3px 8px; border-radius: 10px; }

  .category-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media(max-width: 768px) { .category-grid { grid-template-columns: 1fr; } }

  .category-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .category-card.full-width { grid-column: 1 / -1; }
  .cat-header {
    padding: 14px 18px;
    font-size: 13px;
    font-weight: 600;
    display: flex; align-items: center; gap: 8px;
    border-bottom: 1px solid var(--border);
  }
  .cat-header.ai-color { background: var(--ai-bg); color: var(--ai); }
  .cat-header.markets-color { background: var(--markets-bg); color: var(--markets); }
  .cat-header.crypto-color { background: var(--crypto-bg); color: var(--crypto); }
  .cat-body { padding: 4px 0; }
  
  .news-item {
    padding: 13px 18px;
    border-bottom: 1px solid var(--border);
    transition: background 0.15s;
  }
  .news-item:last-child { border-bottom: none; }
  .news-item:hover { background: var(--surface2); }
  .news-source {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--text-sub);
    margin-bottom: 5px;
  }
  .news-text { font-size: 13.5px; line-height: 1.6; color: var(--text); }
  .empty { padding: 20px 18px; color: var(--text-sub); font-size: 13px; font-style: italic; }

  /* Overview panel */
  .overview-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
  @media(max-width:768px) { .overview-grid { grid-template-columns: 1fr; } }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .stat-label { font-size: 11px; color: var(--text-sub); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
  .stat-value { font-size: 22px; font-weight: 700; }
  .stat-change { font-size: 12px; margin-top: 4px; }
  .up { color: #22c55e; }
  .down { color: #ef4444; }
  .neutral { color: var(--text-sub); }

  footer { text-align: center; padding: 32px; color: var(--text-sub); font-size: 12px; border-top: 1px solid var(--border); margin-top: 40px; }
</style>
</head>

<main>

  </div>

  <!-- AI Tab -->

      <span class="section-title">Crypto</span>

</main>

<script>
// ---- Render logic ----
const AI_CATS = [
  { key: "bigtech", label: "🏢 大厂动态", full: false },
  { key: "trends",  label: "📊 行业趋势", full: false },
  { key: "tech",    label: "🔬 前沿技术", full: false },
  { key: "startup", label: "🚀 初创公司", full: false }
];
const MARKETS_CATS = [
  { key: "overview",    label: "🌐 市场概览", full: true  },
  { key: "macro",       label: "🏦 宏观经济", full: false },
  { key: "policy",      label: "🏛️ 政策动态", full: false },
  { key: "institution", label: "💼 机构动态", full: false },
  { key: "stocks",      label: "📋 个股异动", full: false },
  { key: "commodity",   label: "🛢️ 大宗商品", full: false },
  { key: "other",       label: "📰 其他财经", full: false }
];
const CRYPTO_CATS = [
  { key: "market",  label: "📊 市场行情", full: true  },
  { key: "news",    label: "📰 重大新闻", full: false },
  { key: "onchain", label: "⛓️ 链上动态", full: false },
  { key: "funding", label: "💰 融资动态", full: false }
];

function buildCard(items, label, colorClass, full) {
  const card = document.createElement("div");
  card.className = "category-card" + (full ? " full-width" : "");
  const header = `<div class="cat-header ${colorClass}">${label}</div>`;
  let body = '<div class="cat-body">';
  if (!items || items.length === 0) {
    body += '<div class="empty">暂无数据</div>';
  } else {
    items.forEach(item => {
      body += `<div class="news-item"><div class="news-source">${item.source}</div><div class="news-text">${item.text}</div></div>`;
    });
  }
  body += '</div>';
  card.innerHTML = header + body;
  return card;
}

function renderAll() {
  const d = REPORT_DATA;

  // Header
  document.getElementById("update-time").textContent = `更新于 ${d.date} ${d.updatedAt}`;
  document.getElementById("footer-text").textContent = `ZP News Station · ${d.date} ${d.updatedAt} 自动生成`;

  // Overview stats
  const statsEl = document.getElementById("overview-stats");
  statsEl.innerHTML = `
    <div class="stat-card">
      <div class="stat-label">🤖 AI 热点数</div>
      <div class="stat-value" style="color:var(--ai)">${Object.values(d.ai).flat().length}</div>
      <div class="stat-change neutral">条资讯</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">📈 市场资讯数</div>
      <div class="stat-value" style="color:var(--markets)">${Object.values(d.markets).flat().length}</div>
      <div class="stat-change neutral">条资讯</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">🪙 Crypto 资讯数</div>
      <div class="stat-value" style="color:var(--crypto)">${Object.values(d.crypto).flat().length}</div>
      <div class="stat-change neutral">条资讯</div>
    </div>
  `;

  // Overview highlights
  const aiHighlight = document.getElementById("overview-ai-card");
  aiHighlight.innerHTML = `<div class="cat-header ai-color">🤖 AI 科技 TOP 亮点</div><div class="cat-body">${
    d.ai.bigtech.slice(0,2).map(i=>`<div class="news-item"><div class="news-source">${i.source}</div><div class="news-text">${i.text}</div></div>`).join("")
  }</div>`;

  const marketsHighlight = document.getElementById("overview-markets-card");
  marketsHighlight.innerHTML = `<div class="cat-header markets-color">📈 市场 TOP 亮点</div><div class="cat-body">${
    d.markets.stocks.slice(0,2).map(i=>`<div class="news-item"><div class="news-source">${i.source}</div><div class="news-text">${i.text}</div></div>`).join("")
  }</div>`;

  const cryptoHighlight = document.getElementById("overview-crypto-card");
  cryptoHighlight.innerHTML = `<div class="cat-header crypto-color">🪙 Crypto TOP 亮点</div><div class="cat-body">${
    d.crypto.market.slice(0,2).map(i=>`<div class="news-item"><div class="news-source">${i.source}</div><div class="news-text">${i.text}</div></div>`).join("")
  }</div>`;

  // AI grid
  const aiGrid = document.getElementById("ai-grid");
  AI_CATS.forEach(cat => {
    aiGrid.appendChild(buildCard(d.ai[cat.key], cat.label, "ai-color", cat.full));
  });

  // Markets grid
  const marketsGrid = document.getElementById("markets-grid");
  MARKETS_CATS.forEach(cat => {
    marketsGrid.appendChild(buildCard(d.markets[cat.key], cat.label, "markets-color", cat.full));
  });

  // Crypto grid
  const cryptoGrid = document.getElementById("crypto-grid");
  CRYPTO_CATS.forEach(cat => {
    cryptoGrid.appendChild(buildCard(d.crypto[cat.key], cat.label, "crypto-color", cat.full));
  });
}

// Tab switching
document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));
    tab.classList.add("active");
    document.getElementById("tab-" + tab.dataset.tab).classList.add("active");
  });
});

renderAll();
</script>
</body>
</html>
