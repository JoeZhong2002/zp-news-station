<script>
function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('panel-' + name).classList.add('active');
}

const AI_SECTIONS = {
  bigtech: '🏢 大厂动态',
  trends: '📊 行业趋势',
  tech: '🔬 前沿技术',
  startup: '🚀 初创动态'
};

const MARKET_SECTIONS = {
  overview: '🌐 全球市场概览',
  macro: '📉 宏观经济',
  policy: '🏛️ 政策动态',
  institution: '🏦 机构观点',
  stocks: '📌 个股异动',
  commodity: '🛢️ 大宗商品',
  other: '📋 其他财经'
};

const CRYPTO_SECTIONS = {
  market: '💹 市场行情',
  news: '📰 重大新闻',
  onchain: '⛓️ 链上与技术',
  funding: '💰 融资与市场'
};

function renderItems(items) {
  if (!items || items.length === 0) return '<div class="empty">暂无数据</div>';
  return items.map(item => `
    <div class="news-item">
      <div class="news-source">${item.source}</div>
      <div class="news-text">${item.text}</div>
    </div>
  `).join('');
}

function renderPanel(panelId, data, sections) {
  const panel = document.getElementById(panelId);
  let html = '';
  for (const [key, label] of Object.entries(sections)) {
    html += `<div class="section"><div class="section-title">${label}</div>${renderItems(data[key])}</div>`;
  }
  panel.innerHTML = html;
}

function init() {
  document.getElementById('date-meta').textContent = `${REPORT_DATA.date}  更新于 ${REPORT_DATA.updatedAt}`;
  renderPanel('panel-ai', REPORT_DATA.ai, AI_SECTIONS);
  renderPanel('panel-markets', REPORT_DATA.markets, MARKET_SECTIONS);
  renderPanel('panel-crypto', REPORT_DATA.crypto, CRYPTO_SECTIONS);
}

init();
</script>
