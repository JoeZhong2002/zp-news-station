<title>ZP News Station — 每日三合一日报</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d27;
    --border: #2a2d3d;
    --accent-ai: #6c63ff;
    --accent-mkt: #00d4aa;
    --accent-crypto: #f7931a;
    --text: #e2e8f0;
    --text-dim: #8892a4;
    --tag-bg: #252840;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; }
  header { background: linear-gradient(135deg, #1a1d27 0%, #252840 100%); border-bottom: 1px solid var(--border); padding: 20px 32px; display: flex; align-items: center; justify-content: space-between; }
  header h1 { font-size: 22px; font-weight: 700; letter-spacing: 0.5px; }
  header h1 span { color: var(--accent-crypto); }
  .meta { font-size: 13px; color: var(--text-dim); }
  .tabs { display: flex; gap: 8px; padding: 20px 32px 0; border-bottom: 1px solid var(--border); }
  .tab { padding: 10px 22px; border-radius: 8px 8px 0 0; cursor: pointer; font-size: 14px; font-weight: 600; border: 1px solid transparent; border-bottom: none; transition: all 0.2s; color: var(--text-dim); }
  .tab:hover { background: var(--card); color: var(--text); }
  .tab.active { background: var(--card); color: var(--text); border-color: var(--border); }
  .tab.ai.active { border-top: 3px solid var(--accent-ai); }
  .tab.mkt.active { border-top: 3px solid var(--accent-mkt); }
  .tab.crypto.active { border-top: 3px solid var(--accent-crypto); }
  .panel { display: none; padding: 28px 32px; }
  .panel.active { display: block; }
  .section { margin-bottom: 28px; }
  .section-title { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .news-list { display: flex; flex-direction: column; gap: 10px; }
  .news-item { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start; transition: border-color 0.2s; }
  .news-item:hover { border-color: #444; }
  .source-tag { background: var(--tag-bg); color: var(--text-dim); font-size: 11px; padding: 3px 8px; border-radius: 4px; white-space: nowrap; flex-shrink: 0; margin-top: 2px; }
  .news-text { font-size: 14px; line-height: 1.65; color: var(--text); }
  .empty { color: var(--text-dim); font-size: 13px; font-style: italic; }
  @media (max-width: 640px) {
    header { flex-direction: column; align-items: flex-start; gap: 6px; padding: 16px; }
    .tabs { padding: 16px 16px 0; }
    .panel { padding: 20px 16px; }
  }
</style>

<script>
const SECTIONS = {
  ai: [
    { key: 'bigtech',  label: '大厂动态 BigTech' },
    { key: 'trends',   label: '行业趋势 Trends' },
    { key: 'tech',     label: '前沿技术 Tech' },
    { key: 'startup',  label: '初创公司 Startup' }
  ],
  mkt: [
    { key: 'overview',    label: '全球概览 Overview' },
    { key: 'macro',       label: '宏观经济 Macro' },
    { key: 'policy',      label: '政策政治 Policy' },
    { key: 'institution', label: '投资机构 Institution' },
    { key: 'stocks',      label: '个股异动 Stocks' },
    { key: 'commodity',   label: '大宗商品 Commodity' },
    { key: 'other',       label: '其他财经 Other' }
  ],
  crypto: [
    { key: 'market',   label: '市场行情 Market' },
    { key: 'news',     label: '重大新闻 News' },
    { key: 'onchain',  label: '链上动态 Onchain' },
    { key: 'funding',  label: '融资动态 Funding' }
  ]
};

const DATA_KEYS = { ai: 'ai', mkt: 'markets', crypto: 'crypto' };

function renderPanel(tab) {
  const panel = document.getElementById('panel-' + tab);
  const dataKey = DATA_KEYS[tab];
  const sections = SECTIONS[tab];
  const data = REPORT_DATA[dataKey];
  panel.innerHTML = sections.map(s => {
    const items = (data[s.key] || []);
    return `<div class="section">
      <div class="section-title">${s.label}</div>
      <div class="news-list">${items.length
        ? items.map(it => `<div class="news-item"><span class="source-tag">${it.source}</span><span class="news-text">${it.text}</span></div>`).join('')
        : '<div class="empty">暂无数据</div>'
      }</div></div>`;
  }).join('');
}

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelector('.tab.' + tab).classList.add('active');
  document.getElementById('panel-' + tab).classList.add('active');
}

// Init
document.getElementById('meta-info').textContent = `📅 ${REPORT_DATA.date}  ·  ⏱ 更新于 ${REPORT_DATA.updatedAt}`;
['ai', 'mkt', 'crypto'].forEach(renderPanel);
</script>
