<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ZP News Station</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d2e;
    --card2: #232640;
    --border: #2e3158;
    --text: #e2e8f0;
    --muted: #8892a4;
    --accent-ai: #6366f1;
    --accent-market: #10b981;
    --accent-crypto: #f59e0b;
    --tag-bg: rgba(99,102,241,0.15);
    --tag-market: rgba(16,185,129,0.15);
    --tag-crypto: rgba(245,158,11,0.15);
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 14px;
    line-height: 1.6;
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
  }
  header {
    background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #1e3a5f 100%);
    padding: 24px 16px 20px;
    text-align: center;
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 1.8rem; font-weight: 800; letter-spacing: -0.5px; }
  header h1 span { color: #818cf8; }
  .meta { margin-top: 6px; color: #a5b4fc; font-size: 0.8rem; }
  .tabs {
    display: flex;
    gap: 0;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    scrollbar-width: none;
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 100;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: 1;
    min-width: 80px;
    padding: 12px 8px;
    text-align: center;
    cursor: pointer;
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--muted);
    border-bottom: 3px solid transparent;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .tab.active-ai { color: var(--accent-ai); border-color: var(--accent-ai); background: rgba(99,102,241,0.08); }
  .tab.active-market { color: var(--accent-market); border-color: var(--accent-market); background: rgba(16,185,129,0.08); }
  .tab.active-crypto { color: var(--accent-crypto); border-color: var(--accent-crypto); background: rgba(245,158,11,0.08); }
  .content { display: none; padding: 16px; max-width: 800px; margin: 0 auto; }
  .content.active { display: block; }
  .section { margin-bottom: 20px; }
  .section-title {
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }
  .news-item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 8px;
    transition: border-color 0.2s;
  }
  .news-item:hover { border-color: #4a5175; }
  .news-source {
    font-size: 0.72rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 4px;
  }
  .ai-source { color: var(--accent-ai); }
  .market-source { color: var(--accent-market); }
  .crypto-source { color: var(--accent-crypto); }
  .news-text { font-size: 0.88rem; color: var(--text); }
  .empty { color: var(--muted); font-size: 0.85rem; font-style: italic; padding: 8px 0; }
  .date-badge {
    display: inline-block;
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 3px 12px;
    font-size: 0.75rem;
    color: var(--muted);
    margin-bottom: 16px;
  }
  .holiday-notice {
    background: rgba(245,158,11,0.1);
    border: 1px solid rgba(245,158,11,0.3);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 16px;
    font-size: 0.85rem;
    color: #fcd34d;
  }
</style>
</head>
<body>

<script>
function renderItems(containerId, items, type) {
  const el = document.getElementById(containerId);
  if (!el) return;
  if (!items || items.length === 0) {
    el.innerHTML = '<div class="empty">暂无相关资讯</div>';
    return;
  }
  el.innerHTML = items.map(item => `
    <div class="news-item">
      <div class="news-source ${type}-source">${item.source}</div>
      <div class="news-text">${item.text}</div>
    </div>
  `).join('');
}

function initPage() {
  const d = REPORT_DATA;
  document.getElementById('meta-date').textContent = `${d.date} ${d.updatedAt} 更新`;
  ['ai','market','crypto'].forEach(t => {
    const el = document.getElementById(t + '-date');
    if (el) el.textContent = `📅 ${d.date}`;
  });

  // AI
  renderItems('ai-bigtech', d.ai.bigtech, 'ai');
  renderItems('ai-trends', d.ai.trends, 'ai');
  renderItems('ai-tech', d.ai.tech, 'ai');
  renderItems('ai-startup', d.ai.startup, 'ai');

  // Markets
  if (d.date === '2026-10-01') {
    document.getElementById('market-holiday-notice').hidden = false;
  }
  renderItems('market-overview', d.markets.overview, 'market');
  renderItems('market-macro', d.markets.macro, 'market');
  renderItems('market-policy', d.markets.policy, 'market');
  renderItems('market-institution', d.markets.institution, 'market');
  renderItems('market-stocks', d.markets.stocks, 'market');
  renderItems('market-commodity', d.markets.commodity, 'market');
  renderItems('market-other', d.markets.other, 'market');

  // Crypto
  renderItems('crypto-market', d.crypto.market, 'crypto');
  renderItems('crypto-news', d.crypto.news, 'crypto');
  renderItems('crypto-onchain', d.crypto.onchain, 'crypto');
  renderItems('crypto-funding', d.crypto.funding, 'crypto');

  switchTab('ai');
}

function switchTab(tab) {
  ['ai','market','crypto'].forEach(t => {
    document.getElementById('pane-' + t).classList.remove('active');
    const tabEl = document.getElementById('tab-' + t);
    tabEl.classList.remove('active-ai','active-market','active-crypto');
  });
  document.getElementById('pane-' + tab).classList.add('active');
  document.getElementById('tab-' + tab).classList.add('active-' + tab);
}

initPage();
</script>
</body>
</html>
