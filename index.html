<title>ZP News Station — 每日三合一日报</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3250;
    --text: #e2e8f0;
    --muted: #8892a4;
    --ai: #6366f1;
    --ai-light: #818cf8;
    --markets: #10b981;
    --markets-light: #34d399;
    --crypto: #f59e0b;
    --crypto-light: #fbbf24;
    --tag-bg: rgba(255,255,255,0.06);
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
    font-size: 14px;
    line-height: 1.6;
    min-height: 100vh;
  }

  /* Header */
  .site-header {
    background: linear-gradient(135deg, #1a1d27 0%, #16182a 100%);
    border-bottom: 1px solid var(--border);
    padding: 20px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .site-header h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; }
  .site-header h1 span { color: var(--ai-light); }
  .header-meta { color: var(--muted); font-size: 13px; text-align: right; }
  .live-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--markets-light); animation: pulse 2s infinite; margin-right: 5px; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

  /* Tab nav */
  .tab-nav {
    display: flex;
    gap: 4px;
    padding: 16px 32px 0;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .tab-btn {
    padding: 10px 20px;
    border-radius: 8px 8px 0 0;
    border: 1px solid transparent;
    border-bottom: none;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    transition: all 0.2s;
    position: relative;
    bottom: -1px;
  }
  .tab-btn:hover { color: var(--text); background: var(--surface2); }
  .tab-btn.active { background: var(--bg); border-color: var(--border); color: var(--text); }
  .tab-btn.ai.active { color: var(--ai-light); }
  .tab-btn.markets.active { color: var(--markets-light); }
  .tab-btn.crypto.active { color: var(--crypto-light); }

  /* Main layout */
  .main { padding: 28px 32px; max-width: 1100px; margin: 0 auto; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* Section grid */
  .section-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(480px, 1fr));
    gap: 18px;
    margin-top: 4px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .card-header {
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid var(--border);
    background: var(--surface2);
  }
  .card-header .icon { font-size: 16px; }
  .card-header h3 { font-size: 14px; font-weight: 600; flex: 1; }
  .count-badge {
    font-size: 11px;
    color: var(--muted);
    background: var(--tag-bg);
    padding: 2px 8px;
    border-radius: 20px;
  }
  .card-body { padding: 14px 18px; }

  .news-item {
    display: flex;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    align-items: flex-start;
  }
  .news-item:last-child { border-bottom: none; padding-bottom: 0; }
  .news-dot { width: 6px; height: 6px; border-radius: 50%; margin-top: 7px; flex-shrink: 0; }
  .ai .news-dot { background: var(--ai-light); }
  .markets .news-dot { background: var(--markets-light); }
  .crypto .news-dot { background: var(--crypto-light); }
  .news-content { flex: 1; }
  .news-source {
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 2px;
  }
  .news-text { color: var(--text); font-size: 13.5px; line-height: 1.55; }

  /* Overview card full-width */
  .full-width { grid-column: 1 / -1; }

  /* Footer */
  .site-footer {
    text-align: center;
    padding: 24px;
    color: var(--muted);
    font-size: 12px;
    border-top: 1px solid var(--border);
    margin-top: 40px;
  }
  .site-footer a { color: var(--ai-light); text-decoration: none; }
</style>
</head>

  news:    { icon: '📰', label: '重大新闻', tab: 'crypto' },
  onchain: { icon: '⛓️', label: '链上·技术', tab: 'crypto' },
  funding: { icon: '💰', label: '融资·市场', tab: 'crypto' },
};

function renderCard(key, items, tabClass) {
  const el = document.getElementById('card-' + key);
  if (!el) return;
  const meta = SECTION_META[key];
  const dotsClass = tabClass;
  el.innerHTML = `
    <div class="card-header">
      <span class="icon">${meta.icon}</span>
      <h3>${meta.label}</h3>
      <span class="count-badge">${items.length} 条</span>
    </div>
    <div class="card-body">
      ${items.map(item => `
        <div class="news-item">
          <div class="news-dot" style="background: var(--${dotsClass}-light)"></div>
          <div class="news-content">
            <div class="news-source">${item.source}</div>
            <div class="news-text">${item.text}</div>
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

// Update header
document.getElementById('header-date').textContent = '📅 ' + REPORT_DATA.date;
document.getElementById('header-time').textContent = '🕐 更新于 ' + REPORT_DATA.updatedAt;

// Render all sections
Object.entries(REPORT_DATA.ai).forEach(([k, v]) => renderCard(k, v, 'ai'));
Object.entries(REPORT_DATA.markets).forEach(([k, v]) => renderCard(k, v, 'markets'));
Object.entries(REPORT_DATA.crypto).forEach(([k, v]) => renderCard(k, v, 'crypto'));
</script>
</body>
</html>
